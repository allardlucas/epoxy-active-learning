name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements-app.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r app/requirements-app.txt
      - name: Run tests (analysis and API)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: docker build -t epoxy-explorer .
      - name: Smoke test the running app
        run: |
          docker run -d --name app -p 8000:8000 epoxy-explorer
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/ | grep -q "<title>"
          curl -sf http://localhost:8000/api/campaign | grep -q '"al_beating_initial":0'
          docker images epoxy-explorer --format "Image size: {{.Size}}"
      - name: Show logs on failure
        if: failure()
        run: docker logs app || true

  # Full app (Python API included) on a Hugging Face Space, free CPU hardware.
  # Hugging Face rebuilds the Docker image from the Dockerfile.
  deploy-hf:
    needs: [tests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.HF_TOKEN != '' }}
    steps:
      - name: Skip if the Hugging Face token is missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::HF_TOKEN secret not set, skipping the deployment"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.11"
      - name: Upload to the Space
        if: env.HAS_TOKEN == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install "huggingface_hub>=0.24"
          python scripts/deploy_hf_space.py
